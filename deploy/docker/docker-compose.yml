services:
  svrmon-hub:
    build: .
    image: svrmon-hub:latest
    container_name: svrmon-hub
    restart: unless-stopped
    ports:
      - "8080:8080" # 左边改成软路由上空闲的宿主端口，如 "9000:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - svrmon-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  svrmon-data:
